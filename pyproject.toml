[project]
name = "ML_SERVICE"
version = "0.1.0"
description = "ML сервис классификации новостей на базе RoBERTa: Inference (FastAPI, 24/7) + Train (по требованию)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "torch>=2.7.0",
    "transformers>=4.44.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "python-multipart>=0.0.9",
    "python-json-logger>=2.0.7",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]